services:

  # ---------------------------------------------------------
  # Our backend/API service
  # ---------------------------------------------------------
  agent-api: # This is the name of our service

    # Build the Docker image using the Dockerfile
    # in the current folder.
    build: .

    # Connect our computer's port 8080
    # to the container's port 8080.
    #
    # HOST:CONTAINER
    ports:
      - "8000:8000"

    # Load environment variables from .env
    env_file:
      - .env

    # Set additional environment variables
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO

    # Check whether our API is healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    # Restart the container automatically unless
    # we manually stop it.
    restart: unless-stopped